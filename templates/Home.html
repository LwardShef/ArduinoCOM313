<!-- The actual Page displayed in the final product -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 tool</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<h1 class="title">ESP32 Remote Control</h1>
<div id="columns">
    <div class="column" id="middle-column">
            <div class="data-display" id="temperature-display">
                <h1>Internal Temperature:</h1>
                <h1 id="temperature"></h1>
                <h1>&#176;C</h1>
            </div>
            <div class="data-display">
                <h1>Current Pattern: </h1>
                <h1 id="pattern"></h1>
            </div>
            <div class="data-display">
                <h1>Button Pressed: </h1>
                <h1 id="button"></h1>
            </div>


    </div>
    <div class="column" id="right-column">
        <form  action="/" method="post" id="off">
            <p><input type="submit" name="submit" value="Off"> </p>
        </form>
        <form  action="/" method="post" id="yellow">
            <p><input type="submit" name="submit" value="Solid yellow"> </p>
        </form>
        <form  action="/" method="post" id="red">
            <p><input type="submit" name="submit" value="Solid Red"> </p>
        </form>
        <form  action="/" method="post" id="green">
            <p><input type="submit" name="submit" value="Solid Green"> </p>
        </form>
        <form  action="/" method="post" id="rainbow">
            <p><input type="submit" name="submit" value="Rainbow"> </p>
        </form>
        <form  action="/" method="post" id="chase">
            <p><input type="submit" name="submit" value="Chase"> </p>
        </form>
        <form  action="/" method="post" id="flame">
            <p><input type="submit" name="submit" value="Flame"> </p>
        </form>
    </div>
</div>
<script src="/static/script.js" charset="utf-8"></script>
<script>
        var intervalId = setInterval(function() {getData()}, 2000);
</script>
</body>
</html>

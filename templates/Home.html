<!-- The actual Page displayed in the final product -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 tool</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<h1 class="title">ESP32 Remote Control</h1>
<div id="columns">
    <div id="middle-column">
        <h2>ESP32 Internal Temperature:</h2>
        <h1>{{ temperature }}&#176;C</h1>
    </div>
    <div id="right-column">
        <form  action="/" method="post">
            <p><input type="submit" name="submit" value="Off"> </p>
            <p><input type="submit" name="submit" value="Yellow"> </p>
            <p><input type="submit" name="submit" value="Red"> </p>
            <p><input type="submit" name="submit" value="Green"> </p>
            <p><input type="submit" name="submit" value="Rainbow"> </p>
            <p><input type="submit" name="submit" value="Chase"> </p>
            <p><input type="submit" name="submit" value="Flame"> </p>
        </form>
    </div>
</div>
</body>
</html>
